# Render blueprint: managed Postgres + API (Docker) + static frontend.
# Dashboard → New → Blueprint → point at this repo, then fill the two marked URLs.
databases:
  - name: blush-studio-postgres
    plan: free

services:
  - type: web
    name: blush-studio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blush-studio-postgres
          property: connectionString
          # The app normalizes postgres:// to the async driver automatically.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://blush-studio-frontend.onrender.com  # ← replace with real URL
      - key: ADMIN_EMAIL
        value: owner@example.com  # ← your login email; promoted to admin on boot

  - type: web
    name: blush-studio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://blush-studio-api.onrender.com/api/v1  # ← replace with real URL
